<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagamento · Jogos Interativos</title>
  <meta name="theme-color" content="#070a16">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=Bungee&display=swap" rel="stylesheet">
  <style>
    /* "Fase final": um ingresso com o plano à esquerda e o caixa (Pix, cartão, boleto) à direita. Mesmo visual da página de entrada. */
    :root {
      --bg: #070a16; --bg2: #0c1124; --card: #10162c; --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.16);
      --txt: #eef2ff; --mut: #9aa3c7; --acc: #ff2d55; --acc2: #22e3ee; --gold: #ffc83d; --ok: #4ade80; --bad: #f87171;
      --f-display: Bungee, 'Arial Black', Impact, sans-serif; --f-cond: 'Barlow Condensed', 'Arial Narrow', sans-serif; --f-body: Barlow, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --gut: max(16px, env(safe-area-inset-left, 0px)); --gutr: max(16px, env(safe-area-inset-right, 0px));
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 10% -10%, #2a1446 0%, transparent 60%), radial-gradient(800px 500px at 110% 10%, #08324a 0%, transparent 60%), var(--bg); color: var(--txt); font: 17px/1.5 var(--f-body); overflow-x: hidden; }
    a { color: inherit; } button { font: inherit; cursor: pointer; color: inherit; }
    :focus-visible { outline: 3px solid var(--acc2); outline-offset: 3px; border-radius: 8px; }
    [hidden] { display: none !important; }
    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
    header { display: flex; align-items: center; gap: 12px; padding-block: 14px; padding-left: var(--gut); padding-right: var(--gutr); border-bottom: 1px solid var(--line); }
    .logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 18px; text-decoration: none; white-space: nowrap; }
    .logo i { width: 11px; height: 11px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc); }
    .logo span { color: var(--acc2); }
    header .back { margin-left: auto; font-weight: 800; color: var(--mut); text-decoration: none; }
    .steps { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 18px var(--gutr) 0 var(--gut); color: var(--mut); font-weight: 800; font-size: 14px; flex-wrap: wrap; }
    .steps b { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.08); margin-right: 6px; font-size: 13px; }
    .steps .done b { background: var(--ok); color: #052e12; } .steps .now { color: var(--txt); } .steps .now b { background: var(--acc2); color: #001218; }
    .steps hr { width: 30px; border: 0; border-top: 2px dashed var(--line2); margin: 0; }
    main { max-width: 1060px; margin: 0 auto; padding-block: 26px 60px; padding-left: var(--gut); padding-right: var(--gutr); display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 22px; align-items: start; }
    h1 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4vw, 42px); line-height: 1.05; text-wrap: balance; }
    h1 + p { grid-column: 1 / -1; margin: -10px 0 4px; color: var(--mut); font-size: 18px; }
    .banner { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 18px; background: linear-gradient(90deg, rgba(74,222,128,.14), rgba(34,227,238,.08)); border: 1px solid rgba(74,222,128,.4); font-weight: 700; }
    .banner i { font-style: normal; font-size: 28px; }
    .banner a { margin-left: auto; white-space: nowrap; }

    /* Ingresso do plano */
    .ticket { position: relative; border-radius: 26px; background: linear-gradient(160deg, #1c1438, #10162c 55%); border: 1px solid var(--line2); overflow: hidden; }
    .ticket::before, .ticket::after { content: ""; position: absolute; top: 236px; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line2); }
    .ticket::before { left: -15px; } .ticket::after { right: -15px; }
    .strip { position: relative; height: 210px; overflow: hidden; background: #0b0f20; }
    .strip .row { display: flex; gap: 10px; position: absolute; top: 18px; left: 0; animation: slide 30s linear infinite; }
    .strip img { width: 98px; aspect-ratio: 9/16; object-fit: cover; object-position: top; border-radius: 12px; border: 1px solid var(--line2); flex: none; background: var(--card); }
    .strip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 50%, #160f30); }
    @keyframes slide { to { transform: translateX(-50%); } }
    .tk { padding: 30px 24px 24px; border-top: 2px dashed var(--line2); }
    .tk small { color: var(--mut); font-weight: 800; letter-spacing: .02em; }
    .tk h2 { margin: 2px 0 10px; font-family: var(--f-cond); font-size: 30px; font-weight: 800; line-height: 1.05; }
    .price { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
    .price span { font-family: var(--f-body); font-size: 16px; color: var(--mut); font-weight: 700; }
    .kv { display: grid; gap: 8px; margin-top: 18px; font-size: 15px; }
    .kv div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .kv span:first-child { color: var(--mut); font-weight: 700; }
    .kv span:last-child { font-weight: 800; text-align: right; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 900; }
    .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .chip.wait { background: rgba(255,200,61,.14); color: var(--gold); } .chip.wait::before { animation: blink 1.2s ease-in-out infinite; }
    .chip.ok { background: rgba(74,222,128,.14); color: var(--ok); } .chip.bad { background: rgba(248,113,113,.14); color: var(--bad); } .chip.free { background: rgba(34,227,238,.14); color: var(--acc2); }
    @keyframes blink { 50% { opacity: .25; } }
    .safe { margin: 16px 0 0; color: var(--mut); font-size: 13.5px; }

    /* Caixa */
    .box { border-radius: 26px; background: linear-gradient(180deg, #151c38, var(--card)); border: 1px solid var(--line2); padding: 22px; min-width: 0; }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 18px; background: rgba(0,0,0,.25); margin-bottom: 20px; position: relative; }
    .tabs button { position: relative; z-index: 1; border: 0; background: none; padding: 12px 6px; border-radius: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; transition: color .2s ease; }
    .tabs button.on { color: #001218; }
    .tabs i.pill { position: absolute; z-index: 0; top: 5px; bottom: 5px; border-radius: 14px; background: var(--acc2); transition: transform .35s var(--ease-out), width .35s var(--ease-out); }
    .pane { animation: in .35s var(--ease-out); }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    .pane h3 { margin: 0 0 4px; font-family: var(--f-cond); font-size: 26px; font-weight: 800; }
    .pane > p { margin: 0 0 16px; color: var(--mut); }
    /* QR com "gerador de pixels" */
    .qrwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
    .qr { position: relative; width: 236px; height: 236px; padding: 14px; border-radius: 22px; background: #fff; box-shadow: 0 20px 50px -16px rgba(34,227,238,.5); }
    .qr canvas { width: 208px; height: 208px; display: block; image-rendering: pixelated; }
    .qr .corner { position: absolute; width: 34px; height: 34px; border: 4px solid var(--acc2); }
    .qr .c1 { top: -8px; left: -8px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; } .qr .c2 { top: -8px; right: -8px; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
    .qr .c3 { bottom: -8px; left: -8px; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; } .qr .c4 { bottom: -8px; right: -8px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
    .qr .scan { position: absolute; left: 10px; right: 10px; height: 3px; top: 14px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--acc), transparent); box-shadow: 0 0 14px var(--acc); animation: scan 2.4s ease-in-out infinite alternate; }
    @keyframes scan { to { transform: translateY(206px); } }
    .qr .load { position: absolute; inset: 14px; display: grid; place-items: center; color: #334; font-weight: 800; font-size: 14px; }
    .how { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
    .how li { display: flex; gap: 10px; font-size: 15px; }
    .how li::before { counter-increment: s; content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); font-weight: 900; font-size: 13px; }
    .copy { display: flex; gap: 8px; margin-top: 16px; }
    .copy input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line2); background: #0b1022; color: var(--txt); font: 600 14px/1 ui-monospace, Menlo, Consolas, monospace; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 18px; font-weight: 800; color: #fff; background: rgba(255,255,255,.08); border: 1px solid var(--line2); white-space: nowrap; text-decoration: none; transition: transform .16s var(--ease-out), background-color .2s ease; }
    .btn:active { transform: scale(.97); }
    .btn.pri { background: linear-gradient(95deg, var(--acc), #ff6a3d); border-color: transparent; box-shadow: 0 10px 28px -8px rgba(255,45,85,.6); }
    .btn.big { width: 100%; padding: 15px; font-size: 17px; margin-top: 14px; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .waiting { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: rgba(255,200,61,.08); border: 1px solid rgba(255,200,61,.3); color: #fde68a; font-weight: 700; font-size: 15px; }
    .waiting i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); flex: none; animation: blink 1.2s ease-in-out infinite; }
    /* Cartão animado */
    .cc { perspective: 1200px; width: min(340px, 100%); aspect-ratio: 1.586; margin: 0 auto 18px; }
    .cc-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s var(--ease-out); }
    .cc.flip .cc-in { transform: rotateY(180deg); }
    .cc-f, .cc-b { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 20px 22px; color: #fff; overflow: hidden; background: var(--cg, linear-gradient(135deg, #3b1f6e, #12193a)); box-shadow: 0 24px 50px -18px rgba(0,0,0,.8); }
    .cc-f::after { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%; background: rgba(255,255,255,.08); }
    .cc-b { transform: rotateY(180deg); padding: 0; }
    .cc .chipc { width: 44px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, #ffe29a, #c79a2f); margin-top: 6px; }
    .cc .brand { position: absolute; top: 18px; right: 22px; font: 900 italic 20px/1 var(--f-body); letter-spacing: .02em; }
    .cc .num { margin-top: 22px; font: 700 clamp(17px, 4.6vw, 22px)/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; white-space: nowrap; }
    .cc .bot { position: absolute; left: 22px; right: 22px; bottom: 18px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; text-transform: uppercase; }
    .cc .bot small { display: block; font-size: 9.5px; opacity: .7; letter-spacing: .08em; }
    .cc .bot b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; display: block; }
    .cc .mag { height: 42px; background: #0a0a0a; margin-top: 22px; }
    .cc .sig { margin: 16px 22px 0; height: 36px; border-radius: 4px; background: repeating-linear-gradient(45deg, #eee, #eee 6px, #ddd 6px, #ddd 12px); display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; color: #111; font: 800 16px ui-monospace, monospace; }
    .f { display: block; margin-top: 10px; }
    .f span { display: block; font-size: 13.5px; color: var(--mut); font-weight: 700; margin-bottom: 5px; }
    .f input, .f select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line2); background: #0b1022; color: var(--txt); font: inherit; font-size: 16px; transition: border-color .2s ease; }
    .f input:focus, .f select:focus { outline: none; border-color: var(--acc2); }
    .g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; }
    .g3 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr) minmax(0, 1fr); gap: 0 12px; }
    fieldset { border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px 14px; margin: 14px 0 0; }
    legend { padding: 0 6px; color: var(--mut); font-weight: 800; font-size: 14px; }
    .err { min-height: 22px; margin-top: 10px; color: #ff8aa1; font-weight: 700; font-size: 15px; }
    .linha { font: 700 15px/1.5 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; padding: 14px; border-radius: 14px; background: #0b1022; border: 1px solid var(--line2); }
    /* Tudo certo */
    .win { grid-column: 1 / -1; text-align: center; padding: 50px 20px; border-radius: 28px; background: radial-gradient(600px 300px at 50% 0%, rgba(74,222,128,.22), transparent 70%), linear-gradient(180deg, #151c38, var(--card)); border: 1px solid rgba(74,222,128,.45); animation: in .5s var(--ease-out); }
    .win .big { font-size: 64px; line-height: 1; }
    .win h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 5vw, 46px); margin: 14px 0 8px; }
    .win p { color: #c9d0f0; margin: 0 auto 22px; max-width: 520px; }
    .skel { height: 380px; border-radius: 26px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.08), rgba(255,255,255,.04)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }
    @media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); } .ticket::before, .ticket::after { display: none; } }
    @media (max-width: 560px) { .qrwrap { grid-template-columns: minmax(0, 1fr); justify-items: center; } .g3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .g3 .f:first-child { grid-column: 1 / -1; } .tabs button { font-size: 15px; } .banner { flex-wrap: wrap; } .banner a { margin-left: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .1s !important; } }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <header><a class="logo" href="/inicio"><i></i>Jogos <span>Interativos</span></a><a class="back" href="/">Ir para o painel</a></header>
  <div class="steps"><span class="done"><b>✓</b>Jogos escolhidos</span><hr><span class="done"><b>✓</b>Cadastro</span><hr><span class="now" id="stepPay"><b>3</b>Pagamento</span></div>
  <main id="main">
    <h1 id="titulo">Último passo: liberar os seus jogos</h1>
    <p id="subt">Escolha como prefere pagar. Assim que o pagamento cair, os jogos liberam sozinhos no seu painel.</p>
    <div class="skel"></div><div class="skel"></div>
  </main>

  <script>
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const reais = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const dataBR = (s) => (typeof s === 'number' ? new Date(s) : new Date(s + 'T12:00:00')).toLocaleDateString('pt-BR');
    const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (r.status === 401) { location.replace('/?login'); throw new Error('faça login'); } if (!r.ok) throw new Error(j.error || 'Não deu certo, tente de novo.'); return j; };
    let D = null, CAT = {}, tab = 'PIX', poll = 0, eraAtivo = false;

    const ST = { teste: ['Teste grátis', 'free'], ativo: ['Pago', 'ok'], aguardando: ['Aguardando pagamento', 'wait'], atrasado: ['Atrasado', 'bad'], cancelado: ['Cancelado', 'bad'] };

    async function carregar() {
      const [d, cat] = await Promise.all([api('/api/pagamento'), fetch('/data/catalogo.json').then((r) => r.json()).catch(() => ({ games: [] }))]);
      D = d; cat.games.forEach((g) => (CAT[g.id] = g));
      eraAtivo = d.plano.status === 'ativo' && !d.vencido;
      tab = d.precisaCartao ? 'CREDIT_CARD' : ['PIX', 'CREDIT_CARD', 'BOLETO'].includes(d.formaPref) ? d.formaPref : 'PIX';
      desenhar();
    }

    function desenhar() {
      const p = D.plano, pend = D.pendente, ate = dataBR(p.ate);
      const [stT, stC] = D.vencido && p.status !== 'aguardando' ? ['Vencido', 'bad'] : ST[p.status] || [p.status, 'wait'];
      const quitado = !pend && !D.precisaCartao;
      $('#titulo').textContent = quitado ? 'Tudo certo com o seu plano' : p.status === 'teste' ? 'Seu teste grátis está ativo' : 'Último passo: liberar os seus jogos';
      $('#subt').textContent = quitado ? 'Não há nada para pagar agora.' : p.status === 'teste' ? `Pagar agora é opcional: a primeira cobrança vence em ${pend ? dataBR(pend.vence) : ate}. Se cadastrar o cartão, ela cai sozinha todo mês.` : 'Escolha como prefere pagar. Assim que o pagamento cair, os jogos liberam sozinhos no seu painel.';
      const ids = D.jogos.length ? D.jogos : Object.keys(CAT);
      const capas = ids.slice(0, 16).map((id) => `<img src="/assets/capas/${id}.webp" alt="" loading="lazy" onerror="this.remove()">`).join('');
      const valorAgora = pend ? pend.valor : p.valor;
      const aviso = D.vencido && D.aviso;
      $('.back').hidden = D.vencido;
      const html = `
        ${aviso ? `<div class="banner" style="background:linear-gradient(90deg,rgba(255,200,61,.16),rgba(255,45,85,.08));border-color:rgba(255,200,61,.45)"><i>💳</i><div>${esc(D.aviso)}</div></div>` : ''}
        ${p.status === 'teste' ? `<div class="banner"><i>🎁</i><div>Seus jogos já estão liberados até <b>${ate}</b>.</div><a class="btn" href="/">Começar a jogar</a></div>` : ''}
        <section class="ticket">
          <div class="strip"><div class="row">${capas}${capas}</div></div>
          <div class="tk">
            <small>SEU PLANO</small>
            <h2>${p.todos ? 'Todos os jogos' : `${p.n} jogo${p.n > 1 ? 's' : ''}`} · ${p.ciclo === 'anual' ? 'anual' : 'mensal'}</h2>
            <div class="price">${reais(p.valor)} <span>${p.ciclo === 'anual' ? 'por ano' : 'por mês'}</span></div>
            <div class="kv">
              <div><span>Situação</span><span><i class="chip ${stC}">${stT}</i></span></div>
              ${pend ? `<div><span>Valor desta cobrança</span><span>${reais(pend.valor)}</span></div><div><span>Vencimento</span><span>${dataBR(pend.vence)}</span></div>` : `<div><span>Jogos liberados até</span><span>${ate}</span></div>`}
              <div><span>Jogos</span><span>${ids.slice(0, 3).map((id) => esc(CAT[id]?.name || id)).join(', ')}${ids.length > 3 ? ` e mais ${ids.length - 3}` : ''}</span></div>
            </div>
            <p class="safe">🔒 Pagamento protegido. Os dados do cartão vão direto para o processador de pagamentos e não ficam guardados no site.</p>
          </div>
        </section>
        <section class="box" id="caixa">
          ${quitado && p.ciclo === 'anual' ? `<div class="pane"><h3>Nada para pagar 🎉</h3><p>O seu plano anual está pago até ${ate}.</p><a class="btn pri big" href="/">Ir para o painel</a></div>` : `
          <div class="tabs" role="tablist"><i class="pill"></i>
            ${D.precisaCartao ? '' : '<button data-t="PIX" role="tab">⚡ Pix</button>'}
            <button data-t="CREDIT_CARD" role="tab">💳 Cartão</button>
            ${D.precisaCartao || !pend ? '' : '<button data-t="BOLETO" role="tab">🧾 Boleto</button>'}
          </div>
          <div id="pane"></div>`}
        </section>`;
      $('#main').innerHTML = `<h1 id="titulo">${esc($('#titulo').textContent)}</h1><p id="subt">${esc($('#subt').textContent)}</p>${html}`;
      const tabs = $$('.tabs button');
      if (tabs.length) {
        $('.tabs').style.gridTemplateColumns = `repeat(${tabs.length}, minmax(0, 1fr))`;
        if (!tabs.some((b) => b.dataset.t === tab)) tab = tabs[0].dataset.t;
        if (quitado && tab !== 'CREDIT_CARD') tab = 'CREDIT_CARD';
        $('.tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; mostrar(); } });
        new ResizeObserver(marca).observe($('.tabs'));
        mostrar();
      }
      clearInterval(poll); if (pend || p.status === 'aguardando') poll = setInterval(conferir, 5000);
    }
    function marca() { const on = $('.tabs .on'), pill = $('.tabs .pill'); if (!on || !pill) return; pill.style.width = `${on.offsetWidth}px`; pill.style.transform = `translateX(${on.offsetLeft - 5}px)`; pill.style.left = '5px'; }

    function mostrar() {
      $$('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab)); marca();
      const pane = $('#pane'), pend = D.pendente, p = D.plano;
      if (tab === 'PIX') {
        pane.innerHTML = `<div class="pane"><h3>Pague com Pix</h3><p>Aprovação na hora, a qualquer hora do dia.</p>
          <div class="qrwrap"><div class="qr"><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><canvas id="qrc" width="208" height="208"></canvas><span class="load" id="qrLoad">gerando o QR Code…</span><i class="scan"></i></div>
            <ol class="how"><li><span>Abra o app do seu banco e entre na área Pix</span></li><li><span>Escolha "Pagar com QR Code" e aponte a câmera, ou use o "Pix copia e cola"</span></li><li><span>Confirme o valor de <b>${reais(pend.valor)}</b>. Pronto!</span></li></ol></div>
          <div class="copy"><input id="pixCode" readonly value="carregando…" aria-label="Código Pix copia e cola"><button class="btn pri" id="pixCopy">Copiar código</button></div>
          <div class="waiting"><i></i><span>Esperando o pagamento… esta página atualiza sozinha.</span></div></div>`;
        api('/api/pagamento/pix').then((q) => { $('#pixCode').value = q.payload; pixels('data:image/png;base64,' + q.img); }).catch((e) => { $('#qrLoad').textContent = e.message; });
        $('#pixCopy').addEventListener('click', () => copiar($('#pixCode'), $('#pixCopy')));
      } else if (tab === 'BOLETO') {
        pane.innerHTML = `<div class="pane"><h3>Pague com boleto</h3><p>Pague no app do banco, lotérica ou caixa eletrônico. Leva de 1 a 3 dias úteis para compensar.</p>
          <div class="linha" id="linha">carregando a linha digitável…</div>
          <div class="copy" style="margin-top:12px"><button class="btn pri" id="linCopy" style="flex:1">Copiar linha digitável</button><a class="btn" id="pdf" target="_blank" rel="noopener" hidden>Baixar boleto</a></div>
          <div class="waiting"><i></i><span>Quando o banco confirmar, os jogos liberam sozinhos.</span></div></div>`;
        api('/api/pagamento/boleto').then((b) => { $('#linha').textContent = b.linha; if (b.pdf) { $('#pdf').href = b.pdf; $('#pdf').hidden = false; } }).catch((e) => { $('#linha').textContent = e.message; });
        $('#linCopy').addEventListener('click', () => copiar($('#linha'), $('#linCopy')));
      } else {
        const anual = p.ciclo === 'anual', teste = p.status === 'teste';
        const hojeVence = pend && pend.vence <= new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
        const acao = anual ? `Pagar ${reais(p.valor)}` : hojeVence ? `Pagar ${reais(pend.valor)} e cadastrar` : 'Cadastrar cartão';
        pane.innerHTML = `<div class="pane"><h3>${anual ? 'Pague com cartão' : 'Cartão de crédito'}</h3><p>${anual ? 'Em até ' + D.maxParcelas + 'x sem juros.' : teste || !hojeVence ? `Nada é cobrado agora: a mensalidade cai sozinha no cartão${pend ? ' a partir de ' + dataBR(pend.vence) : ''}.` : 'A mensalidade cai sozinha no cartão todo mês.'}</p>
          <div class="cc" id="cc"><div class="cc-in">
            <div class="cc-f"><div class="chipc"></div><span class="brand" id="ccBrand">CARTÃO</span><div class="num" id="ccNum">•••• •••• •••• ••••</div><div class="bot"><div><small>Nome</small><b id="ccName">SEU NOME</b></div><div><small>Validade</small><b id="ccExp">MM/AA</b></div></div></div>
            <div class="cc-b"><div class="mag"></div><div class="sig" id="ccCvv">•••</div></div>
          </div></div>
          <form id="fCard" autocomplete="on">
            <label class="f"><span>Número do cartão</span><input id="cNum" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="23" required></label>
            <label class="f"><span>Nome impresso no cartão</span><input id="cName" autocomplete="cc-name" required maxlength="60"></label>
            <div class="g2"><label class="f"><span>Validade</span><input id="cExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5" required></label>
              <label class="f"><span>Código (CVV)</span><input id="cCvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" required></label></div>
            ${anual ? `<label class="f"><span>Parcelas</span><select id="cParc">${Array.from({ length: D.maxParcelas }, (_, i) => `<option value="${i + 1}">${i + 1}x de ${reais(Math.round(p.valor / (i + 1)))}${i ? ' sem juros' : ' à vista'}</option>`).join('')}</select></label>` : ''}
            <fieldset><legend>Dados do titular do cartão</legend>
              <label class="f"><span>CPF ou CNPJ do titular</span><input id="cCpf" inputmode="numeric" maxlength="18" required value="${esc(fmtDoc(D.cpf))}"></label>
              <div class="g3"><label class="f"><span>CEP</span><input id="cCep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" required></label>
                <label class="f"><span>Número</span><input id="cNro" maxlength="10" placeholder="123" required></label>
                <label class="f"><span>Celular</span><input id="cTel" inputmode="tel" maxlength="16" placeholder="(11) 90000-0000" autocomplete="tel" required></label></div>
            </fieldset>
            <button class="btn pri big" id="cBtn">${acao}</button>
            <div class="err" id="cErr"></div>
          </form></div>`;
        ligarCartao();
      }
    }

    // ---------- "Gerador de pixels": o QR aparece montando bloquinho por bloquinho ----------
    function pixels(src) {
      const img = new Image();
      img.onload = () => {
        const cv = $('#qrc'); if (!cv) return; const cx = cv.getContext('2d'); $('#qrLoad').hidden = true;
        const off = document.createElement('canvas'); off.width = off.height = 208; off.getContext('2d').drawImage(img, 0, 0, 208, 208);
        const B = 8, blocks = []; for (let y = 0; y < 208; y += B) for (let x = 0; x < 208; x += B) blocks.push([x, y]);
        for (let i = blocks.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [blocks[i], blocks[j]] = [blocks[j], blocks[i]]; }
        if (REDUCE) { cx.drawImage(off, 0, 0); return; }
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, 208, 208);
        let k = 0; const per = Math.ceil(blocks.length / 45);
        const step = () => {
          for (let n = 0; n < per && k < blocks.length; n++, k++) {
            const [x, y] = blocks[k];
            cx.fillStyle = ['#22e3ee', '#ff2d55', '#ffc83d'][k % 3]; cx.fillRect(x, y, B, B); // brilho colorido antes do pixel certo
            setTimeout(() => cx.drawImage(off, x, y, B, B, x, y, B, B), 90);
          }
          if (k < blocks.length) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      };
      img.src = src;
    }

    function copiar(el, btn) {
      const t = el.value ?? el.textContent;
      const ok = () => { const o = btn.textContent; btn.textContent = '✓ Copiado!'; setTimeout(() => (btn.textContent = o), 1800); };
      (navigator.clipboard?.writeText(t) || Promise.reject()).then(ok).catch(() => { const r = document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r); if (el.select) el.select(); document.execCommand('copy'); ok(); });
    }

    // ---------- Cartão ----------
    function fmtDoc(v) { const d = String(v || '').replace(/\D/g, '').slice(0, 14); return d.length <= 11 ? d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/^(\d{3}\.\d{3}\.\d{3})(\d)/, '$1-$2') : d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/, '$1.$2.$3/$4-$5'); }
    const BRANDS = [['Elo', /^(4011|4312|4389|4514|4576|5041|5066|5067|509|6277|6362|6363|650|6516|6550)/, 'linear-gradient(135deg,#111,#3a3a3a)'], ['Hipercard', /^(606282|3841)/, 'linear-gradient(135deg,#b3131b,#5a0a0e)'], ['Amex', /^3[47]/, 'linear-gradient(135deg,#2e77bb,#0d3a66)'], ['Visa', /^4/, 'linear-gradient(135deg,#1a3a9e,#0b1a4f)'], ['Mastercard', /^(5[1-5]|2[2-7])/, 'linear-gradient(135deg,#eb5a1e,#7a1e3a)']];
    function ligarCartao() {
      const cc = $('#cc');
      $('#cNum').addEventListener('input', (e) => {
        const d = e.target.value.replace(/\D/g, '').slice(0, 19); e.target.value = d.replace(/(\d{4})(?=\d)/g, '$1 ');
        $('#ccNum').textContent = (d + '•'.repeat(Math.max(0, 16 - d.length))).replace(/(.{4})(?=.)/g, '$1 ');
        const b = BRANDS.find(([, re]) => re.test(d)); $('#ccBrand').textContent = b ? b[0] : 'CARTÃO'; cc.style.setProperty('--cg', b ? b[2] : '');
      });
      $('#cName').addEventListener('input', (e) => { $('#ccName').textContent = e.target.value.toUpperCase() || 'SEU NOME'; });
      $('#cExp').addEventListener('input', (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; $('#ccExp').textContent = e.target.value || 'MM/AA'; });
      $('#cCvv').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); $('#ccCvv').textContent = e.target.value || '•••'; });
      $('#cCvv').addEventListener('focus', () => cc.classList.add('flip')); $('#cCvv').addEventListener('blur', () => cc.classList.remove('flip'));
      $('#cCpf').addEventListener('input', (e) => { e.target.value = fmtDoc(e.target.value); });
      $('#cCep').addEventListener('input', (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 8); e.target.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; });
      $('#cTel').addEventListener('input', (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 11); e.target.value = d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d; });
      $('#fCard').addEventListener('submit', async (e) => {
        e.preventDefault(); $('#cErr').textContent = ''; const b = $('#cBtn'), t0 = b.textContent; b.disabled = true; b.textContent = 'Processando…';
        const [mes, ano] = $('#cExp').value.split('/');
        try {
          const j = await api('/api/pagamento/cartao', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ numero: $('#cNum').value, nome: $('#cName').value, mes, ano, cvv: $('#cCvv').value, parcelas: Number($('#cParc')?.value) || 1, cpf: $('#cCpf').value, cep: $('#cCep').value, numeroCasa: $('#cNro').value, telefone: $('#cTel').value }) });
          if (j.plano.status === 'ativo' && !j.vencido) vitoria(j.plano, j.msg);
          else { $('#caixa').innerHTML = `<div class="pane"><h3>✅ Pronto!</h3><p>${esc(j.msg)}</p><a class="btn pri big" href="/">Ir para o painel</a></div>`; }
        } catch (x) { $('#cErr').textContent = x.message; } finally { b.disabled = false; b.textContent = t0; }
      });
    }

    // ---------- Confere se o pagamento caiu ----------
    async function conferir() {
      if (document.hidden) return;
      try {
        const j = await api('/api/pagamento/status' + (D.pendente ? `?id=${encodeURIComponent(D.pendente.id)}` : ''));
        if (j.plano.status === 'ativo' && !j.vencido && !eraAtivo) vitoria(j.plano);
      } catch {}
    }
    function vitoria(p, msg) {
      clearInterval(poll); eraAtivo = true;
      $('#stepPay').className = 'done'; $('#stepPay b').textContent = '✓';
      $('#main').innerHTML = `<div class="win"><div class="big">🎮</div><h2>Jogos liberados!</h2><p>${esc(msg || 'Pagamento confirmado.')} O seu plano está ativo até <b>${dataBR(p.ate)}</b>. Bora colocar a live para jogar?</p><a class="btn pri" href="/" style="padding:15px 30px;font-size:18px">Ir para o meu painel</a></div>`;
      festa();
    }
    function festa() {
      if (REDUCE) return;
      const cv = $('#fx'), cx = cv.getContext('2d'), W = (cv.width = innerWidth), H = (cv.height = innerHeight), P = [];
      const IC = ['🪙', '🎉', '💖', '⭐', '🎮', '🌹', '👑'];
      for (let i = 0; i < 90; i++) P.push({ x: W / 2 + (Math.random() - .5) * 120, y: H * .45, vx: (Math.random() - .5) * 900, vy: -Math.random() * 900 - 200, r: Math.random() * 6, s: 18 + Math.random() * 18, ic: IC[i % IC.length] });
      let t0 = performance.now(), life = 0;
      const tick = (t) => { const dt = Math.min(.05, (t - t0) / 1000); t0 = t; life += dt; cx.clearRect(0, 0, W, H);
        for (const p of P) { p.vy += 1400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 4; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.font = `${p.s}px serif`; cx.fillText(p.ic, 0, 0); cx.restore(); }
        if (life < 3.5) requestAnimationFrame(tick); else cx.clearRect(0, 0, W, H); };
      requestAnimationFrame(tick);
    }

    carregar().catch((e) => { $('#main').innerHTML = `<div class="win" style="border-color:var(--line2)"><div class="big">🧾</div><h2>Nada para pagar</h2><p>${esc(e.message)}</p><a class="btn pri" href="/inicio#precos">Ver os planos</a></div>`; });
  </script>
</body>
