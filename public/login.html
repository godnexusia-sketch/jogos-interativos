<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Jogos Interativos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <style>
    :root { --bg: #070a16; --card: #11162a; --line: rgba(255,255,255,.1); --txt: #eef2ff; --mut: #9aa3c7; --acc: #ff2d55; --acc2: #22e3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(1200px 600px at 20% -10%, #2a1446 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #08324a 0%, transparent 60%), var(--bg); color: var(--txt); font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .card { width: min(420px, 100%); background: linear-gradient(180deg, #161c35, var(--card)); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .3px; }
    h1 span { color: var(--acc2); }
    p { margin: 0 0 18px; color: var(--mut); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--mut); margin: 12px 0 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #0b1022; color: var(--txt); font-size: 16px; }
    input:focus { outline: 2px solid var(--acc2); border-color: transparent; }
    button { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; background: linear-gradient(90deg, var(--acc), #ff6b3d); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .err { margin-top: 12px; min-height: 20px; color: #ff8aa1; font-size: 14px; }
    .note { margin-top: 16px; padding: 10px 12px; border-radius: 12px; background: rgba(250,204,21,.1); border: 1px solid rgba(250,204,21,.35); color: #fde68a; font-size: 13px; }
    .or { text-align: center; color: var(--mut); font-size: 13px; margin: 16px 0 10px; }
    #gBtn { display: flex; justify-content: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎮 Jogos <span>Interativos</span></h1>
    <form id="login">
      <p>Entre com o usuário e a senha que o administrador criou para você.</p>
      <label for="u">Usuário ou e-mail</label><input id="u" autocomplete="username" required autofocus>
      <label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" required>
      <button>Entrar</button>
      <div id="gWrap" hidden><div class="or">ou</div><div id="gBtn"></div></div>
    </form>
    <form id="setup" hidden>
      <p><b>Primeiro acesso:</b> crie a conta do administrador. Ela tem acesso total e cria os logins dos outros usuários.</p>
      <label for="c">Código de instalação</label><input id="c" required placeholder="o código que o suporte passou" autocomplete="off">
      <label for="su">Seu e-mail (login do admin)</label><input id="su" autocomplete="username" required minlength="3" maxlength="60">
      <label for="sp">Sua senha (6 ou mais)</label><input id="sp" type="password" autocomplete="new-password" required minlength="6">
      <button>Criar administrador</button>
    </form>
    <div class="err" id="err"></div>
    <div class="note" id="noDb" hidden>⚠️ O banco de dados ainda não está ligado: as contas ficam guardadas só até o servidor reiniciar.</div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id), err = (m) => { $('err').textContent = m || ''; };
    const post = async (url, body) => { const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Não deu certo, tente de novo.'); return j; };
    fetch('/api/auth').then((r) => r.json()).then((a) => {
      if (a.user) return location.replace('/' + location.search);
      if (a.setup) { $('login').hidden = true; $('setup').hidden = false; if (a.adminEmail) { $('su').value = a.adminEmail; $('su').readOnly = true; } $('c').focus(); }
      if (!a.banco) $('noDb').hidden = false;
      // Entrar com o Google (quando o dono configurou o GOOGLE_CLIENT_ID no Render)
      if (a.google && !a.setup) {
        $('gWrap').hidden = false;
        const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
        s.onload = () => { google.accounts.id.initialize({ client_id: a.google, callback: async (r) => { err(''); try { await post('/api/google', { credential: r.credential }); location.replace('/' + location.search); } catch (x) { err(x.message); } } }); google.accounts.id.renderButton($('gBtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'pt-BR', width: 300 }); };
        document.head.appendChild(s);
      }
    }).catch(() => {});
    const go = (form, fn) => form.addEventListener('submit', async (e) => {
      e.preventDefault(); err(''); const b = form.querySelector('button'); b.disabled = true;
      try { await fn(); location.replace('/' + location.search); } catch (x) { err(x.message); } finally { b.disabled = false; }
    });
    go($('login'), () => post('/api/login', { username: $('u').value.trim(), password: $('p').value }));
    go($('setup'), () => post('/api/setup', { code: $('c').value.trim(), username: $('su').value.trim(), password: $('sp').value }));
  </script>
</body>
</html>
