<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogos Interativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar controls">
    <div class="brand"><span class="logo-dot"></span>Jogos <b>Interativos</b></div>
    <form id="connectForm">
      <input id="user" placeholder="@usuário que está ao vivo" autocomplete="off" spellcheck="false">
      <button id="connectBtn" type="submit">Conectar</button>
    </form>
    <span id="status" class="status idle">Desconectado</span>
    <span id="viewers"></span>
  </header>

  <nav id="tabs" class="tabs controls" aria-label="Jogos"></nav>

  <main>
    <section id="stage">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </section>
    <aside class="controls">
      <div class="panel">
        <h3>Como jogar</h3>
        <div id="help"></div>
        <div class="row">
          <button id="editGame" hidden>Editar</button>
          <button id="resetGame">Reiniciar jogo</button>
        </div>
      </div>
      <div class="panel" id="settingsPanel" hidden>
        <h3>Configurar</h3>
        <div id="settings"></div>
      </div>
      <div class="panel">
        <h3>Simulador (teste sem live)</h3>
        <input id="simText" placeholder="comentário (vazio = exemplo do jogo)">
        <div class="row">
          <button id="simChat" title="Comentário">💬 Comentar</button>
          <button id="simLike" title="Likes">❤️ Likes</button>
          <button id="simAuto">▶ Auto</button>
        </div>
        <div class="row gifts">
          <button data-gift="1" title="Rosa (1 moeda)">🌹<small>1</small></button>
          <button data-gift="2" title="Rosquinha (30 moedas)">🍩<small>30</small></button>
          <button data-gift="3" title="Óculos (199 moedas)">🕶️<small>199</small></button>
          <button data-gift="4" title="Galáxia (1000 moedas)">🌌<small>1000</small></button>
        </div>
        <p class="small">Presentes contam pelo valor: 🌹 até 4 moedas · 🍩 5–99 · 🕶️ 100–499 · 🌌 500+.</p>
      </div>
      <div class="panel feed">
        <h3>Eventos da live</h3>
        <ul id="feed"></ul>
      </div>
      <div class="panel">
        <h3>OBS / LIVE Studio</h3>
        <p class="small">Fonte de navegador 1080×1920 (9:16):</p>
        <code id="obsUrl"></code>
      </div>
    </aside>
  </main>
  <script src="core.js"></script>
  <script src="ui.js"></script>
  <script src="three3d.js"></script>
  <script src="race3d.js"></script>
  <script src="games/votacao.js"></script>
  <script src="games/simnao.js"></script>
  <script src="games/urna.js"></script>
  <script src="games/chute.js"></script>
  <script src="games/torcida.js"></script>
  <script src="games/corrida.js"></script>
  <script src="games/kart.js"></script>
  <script src="games/cobra.js"></script>
  <script src="games/combate.js"></script>
  <script src="games/pipa.js"></script>
  <script src="games/avatares.js"></script>
  <script src="games/flappy.js"></script>
  <script src="games/ilha.js"></script>
  <script src="games/desfile.js"></script>
  <script src="app.js"></script>
</body>
</html>
