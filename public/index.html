<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogos Interativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Bangers&family=Fredoka:wght@500;700&display=swap">
  <script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lc/panel.css">
</head>
<body>
  <header class="topbar controls">
    <div class="brand"><span class="logo-dot"></span>Jogos <b>Interativos</b></div>
    <form id="connectForm">
      <input id="user" placeholder="@usuário que está ao vivo" autocomplete="off" spellcheck="false">
      <button id="connectBtn" type="submit">Conectar</button>
    </form>
    <span id="status" class="status idle">Desconectado</span>
    <div class="livestats" id="liveStats" title="Números desta sessão">
      <span id="viewers">👀 0</span><span id="stLikes">❤️ 0</span><span id="stCoins">🪙 0</span><span id="stFollows">⭐ 0</span><span id="stShares">🔁 0</span>
    </div>
    <span id="peers" class="peers" title="Telas da live conectadas no mesmo @"></span>
    <div class="topbtns">
      <button id="muteBtn" title="Silenciar tudo">🔊</button>
      <button id="panicBtn" class="danger" title="Para todos os sons, vozes, alertas e efeitos agora">🛑 Pânico</button>
    </div>
  </header>

  <div class="shell">
    <nav id="rail" class="rail controls" aria-label="Seções"></nav>
    <main>
      <section id="stage">
        <div id="stageBox">
          <canvas id="canvas" width="1080" height="1920"></canvas>
          <div id="ovl"></div>
          <div id="pausedTag" hidden>⏸ PAUSADO</div>
        </div>
        <script>
          // Modo leve: desenha em 720×1280 (metade dos pixels). O jogo é o mesmo, só a resolução muda.
          if (new URLSearchParams(location.search).get('leve') === '1') { const c = document.getElementById('canvas'); c.width = 720; c.height = 1280; }
        </script>
        <div class="stagebar controls">
          <b id="curName">—</b>
          <button id="pauseBtn" title="Congela o jogo sem desconectar do TikTok">⏸ Pausar</button>
          <button id="resetGame" title="Começa a rodada de novo">↻ Reiniciar</button>
          <button id="libBtn" title="Trocar de jogo">🎮 Trocar</button>
        </div>
      </section>
      <section id="view" class="controls"></section>
      <aside id="side" class="controls">
        <div class="panel feed">
          <div class="feedhead"><h3>Chat da live</h3>
            <div class="chips" id="feedFilter"></div>
          </div>
          <ul id="feed"></ul>
          <form id="sayForm" class="row"><input id="sayText" placeholder="Mensagem para falar na live (voz)"><button>🗣️</button></form>
        </div>
        <div class="panel">
          <h3>Top da sessão</h3>
          <div id="topSide"></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="core.js"></script>
  <script src="ui.js"></script>
  <script src="data/gifts.js"></script>
  <script src="lc/engine.js"></script>
  <script src="lc/voice.js"></script>
  <script src="lc/overlay.js"></script>
  <script src="lc/dj.js"></script>
  <script src="lc/kit.js"></script>
  <script src="three3d.js"></script>
  <script src="race3d.js"></script>
  <script src="lc/char3d.js"></script>
  <script src="games/votacao.js"></script>
  <script src="games/simnao.js"></script>
  <script src="games/urna.js"></script>
  <script src="games/chute.js"></script>
  <script src="games/torcida.js"></script>
  <script src="games/corrida.js"></script>
  <script src="games/kart.js"></script>
  <script src="games/cobra.js"></script>
  <script src="games/combate.js"></script>
  <script src="games/pipa.js"></script>
  <script src="games/avatares.js"></script>
  <script src="games/flappy.js"></script>
  <script src="games/ilha.js"></script>
  <script src="games/desfile.js"></script>
  <!-- JOGOS NOVOS -->
  <script src="games/lc/quiz.js"></script>
  <script src="games/lc/quiz2.js"></script>
  <script src="games/lc/words.js"></script>
  <script src="games/lc/guess.js"></script>
  <script src="games/lc/team.js"></script>
  <script src="games/lc/arena3d.js"></script>
  <script src="games/lc/territory3d.js"></script>
  <script src="games/lc/team3d.js"></script>
  <script src="games/lc/tower3d.js"></script>
  <script src="games/lc/arena.js"></script>
  <script src="games/lc/duel.js"></script>
  <script src="games/lc/fighters3d.js"></script>
  <script src="games/lc/party.js"></script>
  <script src="games/lc/hero.js"></script>
  <script src="games/lc/hero3d.js"></script>
  <script src="games/lc/battle3d.js"></script>
  <script src="games/lc/talk.js"></script>
  <script src="app.js"></script>
  <script src="lc/panel.js"></script>
</body>
</html>
