<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogos Interativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Inter:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar controls">
    <strong class="logo">🎮 Jogos Interativos</strong>
    <form id="connectForm">
      <input id="user" placeholder="@usuário que está ao vivo" autocomplete="off" spellcheck="false">
      <button id="connectBtn" type="submit">Conectar</button>
    </form>
    <span id="status" class="status idle">Desconectado</span>
    <span id="viewers"></span>
  </header>

  <nav id="tabs" class="bar controls tabs"></nav>

  <main>
    <section id="stage">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </section>
    <aside class="controls">
      <div class="panel">
        <h3>Como jogar</h3>
        <div id="help"></div>
        <button id="editGame" hidden>Editar nomes / pergunta</button>
        <button id="resetGame">Reiniciar jogo</button>
      </div>
      <div class="panel" id="settingsPanel" hidden>
        <h3>Configurar</h3>
        <div id="settings"></div>
      </div>
      <div class="panel">
        <h3>Simulador</h3>
        <input id="simText" placeholder="comentário (vazio = exemplo do jogo)">
        <div class="row">
          <button id="simChat" title="Comentário">💬</button>
          <button id="simLike" title="Likes">❤️</button>
          <button id="simAuto">Auto</button>
        </div>
        <div class="row">
          <button data-gift="1" title="Rosa (1 moeda)">🌹</button>
          <button data-gift="2" title="Rosquinha (30 moedas)">🍩</button>
          <button data-gift="3" title="Óculos (199 moedas)">🕶️</button>
          <button data-gift="4" title="Galáxia (1000 moedas)">🌌</button>
        </div>
        <p class="small">Presentes contam pelo valor: 🌹 até 4 moedas · 🍩 5–99 · 🕶️ 100–499 · 🌌 500+.</p>
      </div>
      <div class="panel feed">
        <h3>Eventos</h3>
        <ul id="feed"></ul>
      </div>
      <div class="panel">
        <h3>OBS</h3>
        <p class="small">Fonte de navegador (720×1280):</p>
        <code id="obsUrl"></code>
      </div>
    </aside>
  </main>
  <script src="core.js"></script>
  <script src="ui.js"></script>
  <script src="games/votacao.js"></script>
  <script src="games/simnao.js"></script>
  <script src="games/urna.js"></script>
  <script src="games/chute.js"></script>
  <script src="games/torcida.js"></script>
  <script src="games/corrida.js"></script>
  <script src="games/cobra.js"></script>
  <script src="games/combate.js"></script>
  <script src="games/pipa.js"></script>
  <script src="games/avatares.js"></script>
  <script src="games/flappy.js"></script>
  <script src="games/ilha.js"></script>
  <script src="games/desfile.js"></script>
  <script src="app.js"></script>
</body>
</html>
